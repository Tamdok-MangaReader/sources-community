name: Feature request
description: Suggest an improvement to docs, build, or source format
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed change
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Tamdok JS source API / parser
        - Documentation
        - Build / registry
        - Template / scaffolding
        - Other
    validations:
      required: true
